name: CI

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

env:
  SOLUTION_FILE: StudyDocumentManager.sln
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check & Build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }} -p:Configuration=${{ env.BUILD_CONFIGURATION }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_FILE }} -c ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run tests
        run: dotnet test StudyDocumentManager.Tests/StudyDocumentManager.Tests.csproj -c ${{ env.BUILD_CONFIGURATION }} --no-build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output-${{ github.sha }}
          path: |
            StudyDocumentManager/bin/Release/net9.0/
            !StudyDocumentManager/bin/Release/net9.0/*.pdb
            !StudyDocumentManager/bin/Release/net9.0/*.xml
          if-no-files-found: error
          retention-days: 7

  linux-package:
    name: Linux package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-linux-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }} -p:Configuration=${{ env.BUILD_CONFIGURATION }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_FILE }} -c ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run Linux platform tests
        run: dotnet test StudyDocumentManager.Tests/StudyDocumentManager.Tests.csproj -c ${{ env.BUILD_CONFIGURATION }} --no-build --filter "FullyQualifiedName~PlatformSupportTests|FullyQualifiedName~AnalyticsServiceTests"

      - name: Verify Debian packaging script
        run: test -f scripts/build-debian-package.sh || { echo "::error::scripts/build-debian-package.sh is required for Linux package CI."; exit 1; }

      - name: Build Debian package
        run: bash scripts/build-debian-package.sh

      - name: Inspect Debian package
        shell: bash
        run: |
          package=$(find artifacts/installer -maxdepth 1 -type f -name 'document-manager_*_amd64.deb' -print -quit)
          test -n "$package" || { echo "::error::Expected Debian package was not created in artifacts/installer/."; exit 1; }
          test "$(dpkg-deb --field "$package" Architecture)" = "amd64"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: linux-debian-package-${{ github.sha }}
          path: artifacts/installer/document-manager_*_amd64.deb
          if-no-files-found: error
          retention-days: 7
