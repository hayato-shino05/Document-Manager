name: Linux Debian package lifecycle

on:
  workflow_dispatch:
    inputs:
      package_url:
        description: HTTPS URL of the versioned .deb artifact
        required: true
        type: string
      package_sha256:
        description: SHA-256 digest of the .deb artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  lifecycle:
    name: Verify Debian package lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PACKAGE_URL: ${{ inputs.package_url }}
      PACKAGE_SHA256: ${{ inputs.package_sha256 }}
      RELEASE_PREFIX: ${{ github.server_url }}/${{ github.repository }}/releases/download/
      PACKAGE_NAME: document-manager
      EXECUTABLE_PATH: /usr/bin/document-manager
      USER_DATA_RELATIVE_PATH: .local/share/StudyDocumentManager/data/study_documents.db
      TEST_HOME: ${{ runner.temp }}/document-manager-home
    steps:
      - name: Validate artifact contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PACKAGE_URL" == "$RELEASE_PREFIX"* ]]
          [[ "$PACKAGE_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]]

      - name: Download and inspect package metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --output package.deb "$PACKAGE_URL"
          printf '%s  %s\n' "$PACKAGE_SHA256" package.deb | sha256sum --check --status
          [[ "$(dpkg-deb -f package.deb Package)" = "$PACKAGE_NAME" ]]
          [[ "$(dpkg-deb -f package.deb Architecture)" = "amd64" ]]
          dpkg-deb -f package.deb Package Version Architecture

      - name: Install package and initialize user data
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes xvfb
          sudo dpkg --install package.deb || (sudo apt-get --fix-broken install --yes && sudo dpkg --install package.deb)
          test -x "$EXECUTABLE_PATH"
          mkdir --parents "$TEST_HOME"
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            env HOME="$TEST_HOME" timeout --signal=TERM 20 "$EXECUTABLE_PATH"
          launch_exit=$?
          set -e
          [[ "$launch_exit" -eq 0 || "$launch_exit" -eq 124 ]]
          test -f "$TEST_HOME/$USER_DATA_RELATIVE_PATH"

      - name: Purge package and retain user data
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --purge "$PACKAGE_NAME"
          ! dpkg-query --show "$PACKAGE_NAME" >/dev/null 2>&1
          ! test -e "$EXECUTABLE_PATH"
          ! test -e /usr/lib/document-manager
          test -f "$TEST_HOME/$USER_DATA_RELATIVE_PATH"
